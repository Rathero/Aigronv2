<!DOCTYPE html>
<html lang="es" data-font="crt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>AIGRONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">AI<b>GRONS</b></div>
    <!-- Iconos pixel SVG propios (currentColor): mismos en todas las plataformas,
         a diferencia de los emojis, y a juego con la estética del juego. -->
    <div class="chips">
      <div class="chip coin"><span class="ci"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M3 1h4v1H3zM2 2h6v1H2zM1 3h8v4H1zM2 7h6v1H2zM3 8h4v1H3z"/><path fill="#0a0818" d="M4 3h1v4H4zM5 3h2v1H5zM5 6h2v1H5z"/></svg></span><span id="c-coins">0</span></div>
      <div class="chip dust"><span class="ci"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M4 0h2v2H4zM4 8h2v2H4zM0 4h2v2H0zM8 4h2v2H8zM3 3h4v4H3z"/><path fill="#0a0818" d="M4 4h2v2H4z"/></svg></span><span id="c-dust">0</span></div>
      <div class="chip gem"><span class="ci"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M3 1h4v1H3zM2 2h6v1H2zM1 3h8v1H1zM2 4h6v1H2zM3 5h4v1H3zM4 6h2v2H4z"/></svg></span><span id="c-gems">0</span></div>
      <div class="chip ene"><span class="ci"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M5 0h3L5 4h3l-5 6 1-4H2z"/></svg></span><span id="c-ene">5</span><span class="ene-t" id="c-ene-t"></span></div>
    </div>
    <button class="help" data-act="menuToggle" title="Menú">≡</button>
    <div class="menu" id="topmenu">
      <button data-act="menuTutorial">? &nbsp;Tutorial</button>
      <button data-act="menuSound" id="m-sound">🔊 Sonido</button>
      <button data-act="menuFont" id="m-font">Aa Fuente</button>
      <button data-act="menuLogout">⎋ &nbsp;Cerrar sesión</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen active" id="s-home"></div>
  <!-- BATTLE -->
  <div class="screen" id="s-battle"></div>
  <!-- COLLECTION -->
  <div class="screen" id="s-collection"></div>
  <!-- DUNGEON -->
  <div class="screen" id="s-dungeon"></div>
  <!-- RANKING -->
  <div class="screen" id="s-ranking"></div>
  <!-- SHOP -->
  <div class="screen" id="s-shop"></div>

  <!-- Iconos pixel-art propios (SVG con currentColor): unifican el estilo
       con los sprites en vez de mezclar emojis del sistema. -->
  <div class="nav">
    <button data-screen="home" class="on"><span class="ni"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M4 1h2v1H4zM3 2h4v1H3zM2 3h6v1H2zM1 4h8v1H1zM2 5h6v2H2zM2 7h2v2H2zM6 7h2v2H6z"/></svg></span>Inicio</button>
    <button data-screen="dungeon"><span class="ni"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M1 2h2v6H1zM4 3h2v6H4zM7 2h2v6H7z"/></svg></span>Mazmorra</button>
    <button data-screen="collection"><span class="ni"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M2 1h1v8H2zM4 1h4v8H4zM4 1h4v1H4z"/></svg></span>Colección</button>
    <button data-screen="ranking"><span class="ni"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M3 1h4v3H3zM2 2h1v2H2zM7 2h1v2H7zM4 4h2v2H4zM3 7h4v1H3zM2 8h6v1H2z"/></svg></span>Ranking</button>
    <button data-screen="shop"><span class="ni"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="currentColor" d="M1 1h1v2H1zM2 3h6v3H2zM3 7h1v1H3zM6 7h1v1H6zM2 8h2v1H2zM5 8h2v1H5z"/></svg></span>Tienda</button>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <div class="boot" id="boot">
    <div class="logo" style="font-size:18px">AI<b>GRONS</b></div>
    <div id="boot-loading">
      <div class="spinner" id="boot-spin"></div>
      <div class="dim" id="boot-msg">Conectando…</div>
      <button class="btn sm" id="boot-retry" style="display:none;width:auto">REINTENTAR</button>
    </div>
    <div id="boot-login" style="display:none;text-align:center;max-width:300px">
      <div class="dim" style="font-size:13px;margin:14px 0 12px">Inicia sesión para jugar</div>
      <div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>
      <div id="login-dev" style="margin-top:10px"></div>
      <div id="login-err" style="color:var(--red);font-size:12px;min-height:16px;margin-top:8px"></div>
    </div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>

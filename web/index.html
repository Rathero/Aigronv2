<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>AIGRONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0a0818; --bg1:#12102a; --bg2:#1b1740; --panel:#1d1842; --panel2:#241e52;
  --ink:#e8e4ff; --ink-dim:#9a92c8; --line:#3a3270;
  --cyan:#34f5e4; --magenta:#ff4d9d; --gold:#ffd23f; --green:#7CFF6B; --red:#ff5d5d;
  --com:#8b86b8; --rar:#43b6ff; --epi:#c061ff; --leg:#ffd23f;
  --pixel: 'Press Start 2P', monospace;
  --ui: 'Silkscreen', monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--ui);background:var(--bg0);color:var(--ink);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background-image:
    radial-gradient(1200px 800px at 80% -10%, rgba(192,97,255,.18), transparent 60%),
    radial-gradient(1000px 700px at 0% 110%, rgba(52,245,228,.14), transparent 55%),
    linear-gradient(180deg,#0a0818,#070612);
}
/* twinkling starfield on the ambient web background */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
    radial-gradient(1px 1px at 70% 60%, #fff6, transparent),
    radial-gradient(1px 1px at 40% 80%, #fff5, transparent),
    radial-gradient(2px 2px at 90% 20%, #b6f6ff7a, transparent),
    radial-gradient(1px 1px at 55% 15%, #ffd9f37a, transparent);
  background-size:cover;animation:tw 5s steps(8) infinite;opacity:.7;
}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:.8}}

/* phone frame on web, fullscreen on mobile */
#app{
  position:relative;z-index:1;width:100%;max-width:440px;height:100%;max-height:920px;
  background:linear-gradient(180deg,var(--bg1),var(--bg0));
  display:flex;flex-direction:column;overflow:hidden;
  border:3px solid var(--line);
  box-shadow:0 0 0 3px #000, 0 30px 80px rgba(0,0,0,.7), inset 0 0 60px rgba(52,245,228,.05);
}
@media (max-width:460px){ #app{border:none;max-height:none;box-shadow:none} }
/* faint scanlines */
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);mix-blend-mode:overlay}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:2px solid var(--line);background:rgba(10,8,24,.6);backdrop-filter:blur(4px);z-index:10}
.logo{font-family:var(--pixel);font-size:13px;letter-spacing:1px;
  color:var(--cyan);text-shadow:2px 2px 0 #0a3, 0 0 12px rgba(52,245,228,.5)}
.logo b{color:var(--magenta);text-shadow:2px 2px 0 #500a2a,0 0 12px rgba(255,77,157,.5)}
.chips{margin-left:auto;display:flex;gap:4px}
.chip{display:flex;align-items:center;gap:3px;background:#0a0818;border:2px solid var(--line);
  padding:4px 5px;font-size:12px;font-weight:700}
.chip span:first-child{font-size:11px}
.chip .ic{width:12px;height:12px;display:inline-block;image-rendering:pixelated}
.chip.coin{color:var(--gold)} .chip.dust{color:#bfe3ff} .chip.gem{color:var(--magenta)} .chip.ene{color:var(--cyan)}

/* ---------- screens ---------- */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 16px;display:none;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.screen.active{display:block;animation:fade .25s ease}
.screen::-webkit-scrollbar{width:6px}.screen::-webkit-scrollbar-thumb{background:var(--line)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.title{font-family:var(--pixel);font-size:12px;color:var(--ink);margin:2px 0 12px;
  letter-spacing:1px;display:flex;align-items:center;gap:8px}
h2.title small{font-family:var(--ui);font-size:13px;color:var(--ink-dim);font-weight:400}
.subtle{color:var(--ink-dim);font-size:14px}

/* ---------- panels / pixel borders ---------- */
.panel{background:var(--panel);border:2px solid var(--line);padding:12px;margin-bottom:12px;
  box-shadow:inset 0 0 0 2px #0a0818, 4px 4px 0 #00000055}
.panel.glow-cyan{box-shadow:inset 0 0 0 2px #0a0818,0 0 18px rgba(52,245,228,.25),4px 4px 0 #0008}

/* ---------- buttons ---------- */
.btn{font-family:var(--ui);font-weight:700;font-size:15px;color:#06121f;cursor:pointer;
  background:var(--cyan);border:none;padding:11px 14px;width:100%;letter-spacing:.5px;
  box-shadow:0 4px 0 #0c8f86, 0 6px 0 #000;transition:transform .05s, box-shadow .05s;text-transform:uppercase}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #0c8f86,0 2px 0 #000}
.btn.mag{background:var(--magenta);color:#21030f;box-shadow:0 4px 0 #9c2a5f,0 6px 0 #000}
.btn.mag:active{box-shadow:0 0 0,0 2px 0 #000}
.btn.gold{background:var(--gold);color:#2a1d00;box-shadow:0 4px 0 #b58e10,0 6px 0 #000}
.btn.ghost{background:#0a0818;color:var(--ink);box-shadow:0 4px 0 #000;border:2px solid var(--line)}
.btn.sm{font-size:13px;padding:8px 10px;width:auto}
.btn[disabled]{filter:grayscale(.7) brightness(.6);cursor:not-allowed}
.row{display:flex;gap:8px}

/* ---------- daily claim card ---------- */
.daily{position:relative;text-align:center;padding:18px 12px;overflow:hidden}
.daily .halo{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(52,245,228,.18),transparent 60%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.egg{width:120px;height:120px;margin:6px auto;image-rendering:pixelated;
  filter:drop-shadow(0 0 14px rgba(52,245,228,.4));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- creature card ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel2);border:2px solid var(--com);padding:6px 4px 7px;text-align:center;
  position:relative;cursor:pointer;transition:transform .08s}
.card:active{transform:scale(.96)}
.card.r-RARA{border-color:var(--rar)} .card.r-EPICA{border-color:var(--epi);box-shadow:0 0 12px rgba(192,97,255,.35)}
.card.r-LEGENDARIA{border-color:var(--leg);box-shadow:0 0 16px rgba(255,210,63,.45);animation:legpulse 2s infinite}
@keyframes legpulse{0%,100%{box-shadow:0 0 10px rgba(255,210,63,.35)}50%{box-shadow:0 0 22px rgba(255,210,63,.7)}}
.card canvas{width:100%;image-rendering:pixelated;display:block;background:#0a081880}
.card .nm{font-size:12px;margin-top:3px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ty{font-size:10px;color:var(--ink-dim)}
.card .lv{position:absolute;top:2px;left:2px;background:#0a0818cc;font-size:10px;padding:1px 3px;border:1px solid var(--line)}
.card .fav{position:absolute;top:2px;right:3px;font-size:11px;color:var(--gold)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--magenta);color:#fff;font-size:10px;
  padding:2px 5px;border:2px solid #000;animation:bob 1.5s infinite}

.type-pill{display:inline-block;font-size:11px;padding:2px 6px;border:1px solid var(--line);background:#0a0818}
.rar-txt.COMUN{color:var(--com)}.rar-txt.RARA{color:var(--rar)}.rar-txt.EPICA{color:var(--epi)}.rar-txt.LEGENDARIA{color:var(--leg)}

/* ---------- stat bars ---------- */
.stat{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.stat .lab{width:34px;color:var(--ink-dim)}
.stat .bar{flex:1;height:9px;background:#0a0818;border:1px solid var(--line);overflow:hidden}
.stat .fill{height:100%;display:block;background:var(--cyan)}
.stat .val{width:34px;text-align:right;font-weight:700}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters .f{font-size:12px;padding:5px 8px;border:2px solid var(--line);background:#0a0818;cursor:pointer;color:var(--ink-dim)}
.filters .f.on{background:var(--cyan);color:#06121f;border-color:var(--cyan)}

/* ---------- battle ---------- */
.arena{position:relative;min-height:300px;border:2px solid var(--line);background:
  linear-gradient(180deg,#1a1640,#0c0a22);overflow:hidden;margin-bottom:10px;padding:8px}
.arena .vs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--pixel);
  font-size:18px;color:var(--magenta);text-shadow:2px 2px 0 #000;z-index:3;pointer-events:none;opacity:0}
.side{display:flex;justify-content:space-around;align-items:flex-end}
.fighter{width:30%;text-align:center;position:relative;transition:transform .15s,opacity .3s}
.fighter canvas{width:74px;image-rendering:pixelated;animation:bob 2.6s ease-in-out infinite}
.fighter.enemy canvas{transform:scaleX(-1)}
.fighter.dead{opacity:.18;filter:grayscale(1)}
.fighter.hit{animation:hit .25s}
@keyframes hit{0%,100%{transform:none}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.hpbar{height:7px;background:#0a0818;border:1px solid var(--line);margin:2px 4px}
.hpbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.fname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.energy-pips{display:flex;gap:2px;justify-content:center;margin-top:2px}
.pip{width:6px;height:6px;background:#0a0818;border:1px solid var(--line)}
.pip.on{background:var(--cyan);box-shadow:0 0 4px var(--cyan)}
.ability-btns{display:flex;gap:6px;margin-top:8px}
.ab{flex:1;font-size:11px;padding:6px 4px;border:2px solid var(--line);background:#0a0818;color:var(--ink-dim);cursor:pointer;text-align:center}
.ab.ready{border-color:var(--gold);color:var(--gold);animation:legpulse 1.2s infinite;cursor:pointer}
.ab.ready:active{transform:translateY(2px)}
.ab.armed{border-color:var(--magenta);color:var(--magenta);box-shadow:0 0 8px rgba(255,77,157,.4)}
.abunit{flex:1;display:flex;gap:3px}
.abunit .ab{flex:1}
.gbtn{width:30px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#0a0818;color:var(--ink-dim);cursor:pointer;font-size:14px}
.gbtn.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.fighter .thint{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;display:none;z-index:4}
.fighter.targetable{cursor:pointer;outline:2px dashed var(--cyan);outline-offset:-2px}
.fighter.guarding{outline:2px solid var(--cyan);outline-offset:-2px;box-shadow:0 0 10px rgba(52,245,228,.5)}
.targhint{font-size:12px;text-align:center;padding:5px;color:var(--cyan);border:2px dashed var(--cyan);background:#0a0818;margin-bottom:6px}
.stances{display:flex;gap:6px}
.stance{flex:1;text-align:center;padding:8px 4px;border:2px solid var(--line);background:#0a0818;cursor:pointer;font-size:12px;line-height:1.3}
.stance.on{border-color:var(--gold);color:var(--gold)}
.floatnum{position:absolute;font-family:var(--pixel);font-size:11px;pointer-events:none;
  animation:floatup 1s ease-out forwards;z-index:5}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.log{font-size:12px;color:var(--ink-dim);height:54px;overflow-y:auto;border:2px solid var(--line);background:#0a0818;padding:6px;margin-top:8px}

/* ---------- ranking ---------- */
.rank-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.rank-row .pos{width:26px;font-family:var(--pixel);font-size:11px;color:var(--gold)}
.rank-row.me{background:rgba(52,245,228,.12);border:2px solid var(--cyan)}
.rank-row .nm{flex:1;font-weight:700}
.tabs{display:flex;margin-bottom:10px}
.tabs .t{flex:1;text-align:center;padding:8px;border:2px solid var(--line);background:#0a0818;cursor:pointer;font-size:13px;color:var(--ink-dim)}
.tabs .t.on{background:var(--magenta);color:#fff;border-color:var(--magenta)}

/* ---------- shop ---------- */
.shop-item{display:flex;align-items:center;gap:10px}
.shop-item .ico{font-size:26px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#0a0818;border:2px solid var(--line)}
.shop-item .meta{flex:1}.shop-item .meta .t{font-weight:700}.shop-item .meta .d{font-size:12px;color:var(--ink-dim)}

/* ---------- bottom nav ---------- */
.nav{display:flex;border-top:2px solid var(--line);background:rgba(10,8,24,.85);backdrop-filter:blur(6px);z-index:10}
.nav button{flex:1;background:none;border:none;color:var(--ink-dim);padding:8px 2px 9px;cursor:pointer;
  font-family:var(--ui);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ni{font-size:18px;line-height:1}
.nav button.on{color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.nav button.on .ni{transform:translateY(-1px)}

/* ---------- overlay / modal ---------- */
.overlay{position:absolute;inset:0;background:rgba(5,4,14,.85);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex;animation:fade .2s}
.modal{background:var(--panel);border:3px solid var(--line);max-width:360px;width:100%;
  padding:16px;box-shadow:0 0 0 3px #000,0 20px 60px #000;max-height:90%;overflow-y:auto}
.reveal canvas{width:160px;image-rendering:pixelated;display:block;margin:0 auto;animation:reveal .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes reveal{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1);opacity:1}}
.center{text-align:center}
.rays{position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 10deg,rgba(255,210,63,.12) 10deg 20deg,transparent 20deg 30deg);animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#0a0818;border:2px solid var(--cyan);
  padding:8px 14px;font-size:13px;z-index:200;color:var(--cyan);display:none;white-space:nowrap}
.toast.show{display:block;animation:fade .2s}
.mb8{margin-bottom:8px}.mt8{margin-top:8px}.tc{text-align:center}.dim{color:var(--ink-dim)}
/* arte por IA (image_url) con fallback al sprite procedural en canvas */
.aigimg{width:100%;image-rendering:pixelated;display:block;background:#0a081880}
.fighter .aigimg{width:74px}.fighter.enemy .aigimg{transform:scaleX(-1)}
.reveal .aigimg,.modal .aigimg{max-width:170px;margin:0 auto}
/* pantalla de conexión / error */
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;z-index:300;background:var(--bg0)}
.boot.hide{display:none}
.spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}
/* tutorial + botón de ayuda */
.help{margin-left:6px;width:26px;height:26px;border:2px solid var(--line);background:#0a0818;color:var(--cyan);font-family:var(--ui);font-weight:700;cursor:pointer;font-size:14px;flex:0 0 auto}
.help:active{transform:translateY(1px)}
.tut-dots{display:flex;gap:5px;justify-content:center}
.tut-dot{width:7px;height:7px;background:var(--line);border-radius:50%}
.tut-dot.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
/* mazmorra roguelike */
.dg-bar{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.dg-pip{width:10px;height:10px;border:1px solid var(--line);background:#0a0818}
.dg-pip.done{background:var(--cyan)}.dg-pip.boss{border-color:var(--gold)}
.dg-team{display:flex;gap:6px;margin-bottom:10px}
.dg-mem{flex:1;border:2px solid var(--line);background:var(--panel2);padding:4px;text-align:center;position:relative}
.dg-mem.dead{opacity:.35;filter:grayscale(1)}
.dg-mem .hpbar{height:6px;background:#0a0818;border:1px solid var(--line);margin-top:3px}
.dg-mem .hpbar i{display:block;height:100%;background:var(--green)}
.dg-relics{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;min-height:24px}
.dg-relic{font-size:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#0a0818}
.node-opt{border:2px solid var(--line);background:var(--panel);padding:12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .08s}
.node-opt:active{transform:scale(.98)}
.node-opt.COMBATE{border-color:var(--rar)}.node-opt.ELITE{border-color:var(--epi)}.node-opt.JEFE{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,63,.4)}
.node-opt.DESCANSO{border-color:var(--green)}.node-opt.TIENDA{border-color:var(--cyan)}
.node-opt .ni2{font-size:26px}
.relic-card{border:2px solid var(--line);background:var(--panel);padding:10px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.relic-card:active{transform:scale(.98)}
.relic-card .re{font-size:24px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">AI<b>GRONS</b></div>
    <div class="chips">
      <div class="chip coin"><span>🪙</span><span id="c-coins">0</span></div>
      <div class="chip dust"><span>✨</span><span id="c-dust">0</span></div>
      <div class="chip gem"><span>💎</span><span id="c-gems">0</span></div>
      <div class="chip ene"><span>⚡</span><span id="c-ene">5</span></div>
    </div>
    <button class="help" data-act="openTutorial" title="Tutorial">?</button>
  </div>

  <!-- HOME -->
  <div class="screen active" id="s-home"></div>
  <!-- BATTLE -->
  <div class="screen" id="s-battle"></div>
  <!-- COLLECTION -->
  <div class="screen" id="s-collection"></div>
  <!-- DUNGEON -->
  <div class="screen" id="s-dungeon"></div>
  <!-- RANKING -->
  <div class="screen" id="s-ranking"></div>
  <!-- SHOP -->
  <div class="screen" id="s-shop"></div>

  <div class="nav">
    <button data-screen="home" class="on"><span class="ni">🏠</span>Inicio</button>
    <button data-screen="battle"><span class="ni">⚔️</span>Combate</button>
    <button data-screen="dungeon"><span class="ni">🗺️</span>Mazmorra</button>
    <button data-screen="collection"><span class="ni">📖</span>Colección</button>
    <button data-screen="ranking"><span class="ni">🏆</span>Ranking</button>
    <button data-screen="shop"><span class="ni">🛒</span>Tienda</button>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <div class="boot" id="boot">
    <div class="logo" style="font-size:18px">AI<b>GRONS</b></div>
    <div class="spinner" id="boot-spin"></div>
    <div class="dim" id="boot-msg">Conectando…</div>
    <button class="btn sm" id="boot-retry" style="display:none;width:auto" onclick="window.__retryBoot&&window.__retryBoot()">REINTENTAR</button>
  </div>
</div>
<script src="engine.js"></script>
<script>
/* =========================================================================
   AIGRONS — frontend ONLINE (habla con la API del backend).
   - El estado vive en el servidor (auth, colección, equipo, combate, tienda).
   - El sprite pixel-art se dibuja de forma DETERMINISTA desde template_id/art_seed
     (motor compartido engine.js); si la plantilla trae image_url (arte IA), se
     muestra esa imagen con fallback al sprite procedural.
   - El combate usa el MISMO motor seeded que el servidor: se reproduce la
     animación con el `seed` de /battle/find, se registran las decisiones y el
     servidor recalcula para conceder recompensas (anti-trampa).
   ========================================================================= */
const E = window.ENGINE;
const { ABILITIES, ABILITY_BY_TYPE, RANGES, RARITIES, mulberry32, hashStr,
        scaled, genTemplate, typeMult, computeLeague, COMBAT_ENERGY_MAX, TURNS_MAX } = E;

/* paletas pixel por tipo: [oscuro, medio, claro, acento] */
const PAL = {
  VOLCAN:["#5a1500","#c4391a","#ff8a3c","#ffe27a"],
  NIEBLA:["#2a3340","#5d7488","#aebfce","#d7f3ff"],
  CRISTAL:["#0a4d5e","#1fb6c9","#7df0ff","#ffffff"],
  RELOJ:["#4a2e0a","#a9741f","#ffcf5e","#fff2c0"],
  VACIO:["#1b0a33","#5b1f96","#a45cff","#ff8af0"],
  BESTIA:["#3a2412","#7a4a23","#c79a5e","#ffe6b0"],

/* ---------------- Generador de sprite pixel-art (determinista) ---------------- */
function spriteSeed(tpl){ return (tpl.art_seed!=null?tpl.art_seed:hashStr(tpl.id||"x"))>>>0; }
function buildSprite(tpl){
  const N=16, half=8, rng=mulberry32(spriteSeed(tpl)^0x9e3779b9);
  const g=Array.from({length:N},()=>Array(N).fill(0));
  const rowW=[]; let topY=N, botY=0;
  for(let y=0;y<N;y++){
    const profile=Math.sin(Math.PI*(y+0.5)/N);
    let w=Math.round(profile*6 + (rng()*2-1)*1.2);
    if(y<3||y>13) w=Math.max(0,w-1);
    w=Math.max(0,Math.min(7,w));
    rowW[y]=w;
    if(w>0){topY=Math.min(topY,y);botY=Math.max(botY,y);}
  }
  for(let y=0;y<N;y++){
    const w=rowW[y]; if(!w)continue;
    for(let x=8-w;x<=7;x++){
      let v=1;
      if(y<=topY+2 && rng()<0.55) v=2;
      else if(x===8-w && rng()<0.6) v=3;
      else if(rng()<0.12) v=5;
      g[y][x]=v;
    }
  }
  let eyeY=Math.min(botY-2, topY+3);
  if(eyeY<topY) eyeY=topY+1;
  const ex=Math.max(8-rowW[eyeY]+1, 4);
  if(rowW[eyeY]>0 && g[eyeY] && g[eyeY][ex]){ g[eyeY][ex]=7; if(g[eyeY-1]) g[eyeY-1][ex]=6; }
  if((tpl.rarity==="EPICA"||tpl.rarity==="LEGENDARIA") && topY>0){
    const hx=Math.max(8-rowW[topY],3);
    g[topY-1][hx]=8; if(topY-2>=0)g[topY-2][hx]=8;
  }
  for(let y=0;y<N;y++) for(let x=0;x<half;x++) g[y][N-1-x]=g[y][x];
  const out=Array.from({length:N},()=>Array(N).fill(0));
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(g[y][x]!==0)continue;
    const nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const[dx,dy]of nb){const ny=y+dy,nx=x+dx;
      if(ny>=0&&ny<N&&nx>=0&&nx<N&&g[ny][nx]!==0&&g[ny][nx]!==4){out[y][x]=4;break;}}
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++) if(out[y][x]===4&&g[y][x]===0) g[y][x]=4;
  if(tpl.rarity==="LEGENDARIA"){for(let k=0;k<4;k++){const sx=Math.floor(rng()*N),sy=Math.floor(rng()*N);if(g[sy][sx]===0)g[sy][sx]=9;}}
  return g;
}
function colorFor(v,tpl){
  const p=PAL[tpl.type]||PAL.VACIO;
  switch(v){case 1:return p[1];case 2:return p[2];case 3:return p[0];case 5:return p[3];
    case 6:return "#ffffff";case 7:return "#0c0a1a";case 8:return p[3];
    case 4:return tpl.rarity==="LEGENDARIA"?"#ffd23f":"#08060f";case 9:return "#fff7c8";default:return null;}
}
const _spriteCache={};
function drawAigron(canvas,tpl,px){
  px=px||8; const N=16;
  canvas.width=N*px; canvas.height=N*px;
  const ctx=canvas.getContext("2d"); ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const key=tpl.id||("s"+spriteSeed(tpl));
  const g=_spriteCache[key]||(_spriteCache[key]=buildSprite(tpl));
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const c=colorFor(g[y][x],tpl); if(!c)continue;
    ctx.fillStyle=c; ctx.fillRect(x*px,y*px,px,px);
  }
}
function drawEgg(canvas,px){
  px=px||8;const N=16;canvas.width=N*px;canvas.height=N*px;
  const ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,N*px,N*px);
  for(let y=2;y<15;y++){const w=Math.round(Math.sin(Math.PI*(y-1)/15)*6);
    for(let x=8-w;x<=7+w;x++){ctx.fillStyle=(y<6?"#7df0ff":"#1fb6c9");ctx.fillRect(x*px,y*px,px,px);}}
  ctx.fillStyle="#08060f";
  [[7,6],[8,6],[7,7],[8,8],[7,9],[7,11]].forEach(([x,y])=>ctx.fillRect(x*px,y*px,px,px));
}

/* HTML del arte: imagen IA si existe, si no canvas procedural */
function artTag(t,px){
  if(t&&t.image_url) return `<img class="aigimg" src="${t.image_url}" alt="${t.name||''}">`;
  return `<canvas data-aig="${t.id}" data-px="${px}"></canvas>`;
}

/* ---------------- Capa de API ---------------- */
const API_BASE = (location.protocol==='file:') ? (localStorage.getItem('aigrons_api')||'http://localhost:3000') : '';
let TOKEN = localStorage.getItem('aigrons_token')||'';
function deviceId(){
  let d=localStorage.getItem('aigrons_device');
  if(!d){ d='dev-'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('aigrons_device',d); }
  return d;
}
async function api(path, opts={}){
  const headers={'content-type':'application/json'};
  if(TOKEN) headers.authorization='Bearer '+TOKEN;
  let res;
  try{
    res = await fetch(API_BASE+path, {method:opts.method||'GET', headers, body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){ throw {status:0, network:true}; }
  if(res.status===401){ TOKEN=''; localStorage.removeItem('aigrons_token'); throw {status:401}; }
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok) throw {status:res.status, data};
  return data;
}
async function login(){
  let name=localStorage.getItem('aigrons_name');
  if(!name){ name='Jugador'+Math.floor(Math.random()*9000+1000); localStorage.setItem('aigrons_name',name); }
  const r=await api('/auth/login',{method:'POST',body:{provider:'dev',subject:deviceId(),displayName:name}});
  TOKEN=r.token; localStorage.setItem('aigrons_token',TOKEN); return r.user;
}

let CB=null, prep=null;
function mkUnit(s,team,i){ return E.unitFromStats(s,team,i); }

/* --- Preparación: capitán + estancia (decisión previa) --- */
function prepBattle(){
  const team=S.team.map(instById).filter(Boolean);

function renderPrep(team){
  const capCards=team.map(i=>`<div class="card r-${i.template.rarity}" data-cap="${i.instance_id}" style="${prep.captain===i.instance_id?'outline:3px solid var(--gold);outline-offset:-3px':''}">

function goBattle(){ const p=prep; closeOverlay(); startBattle(p.captain,p.stance); }

function startBattle(captain,stance){
  if(S.user.energy<1){toast("Sin energía ⚡ — recarga con el tiempo");return;}
  if(!S.team.length){toast("Equipo vacío");return;}
  api('/battle/find',{method:'POST',body:{captain,stance}}).then(d=>{
    const A=d.team.map((s,i)=>mkUnit(s,'A',i));
    const B=d.opponent.map((s,i)=>mkUnit(s,'B',i));
    CB={A,B,seed:d.seed|0,battleId:d.battleId,pvp:d.pvp,rng:mulberry32(d.seed>>>0),
        turn:0,order:[],oi:0,armed:{},targeting:null,decisions:[],timer:null,
        initA:d.team,initB:d.opponent,ended:false};
    buildArena();
    const vs=$(".vs"); if(vs){vs.style.opacity=1;setTimeout(()=>{vs.style.opacity=0;},900);}
    CB.timer=setInterval(tick,640);
  }).catch(err=>{
    if(err.status===402)toast('Sin energía ⚡');
    else if(err.status===400)toast('Equipo vacío');
    else toast('Error de conexión');
  });
}
function buildArena(){
  const fHTML=(u)=>`<div class="fighter ${u.team==='B'?'enemy':''}" data-uid="${u.uid}" ${u.team==='B'?`data-act="tapEnemy" data-arg="${u.uid}"`:''}>
     <div class="thint"></div>
     ${artTag(tpl(u.tplId),5)}
     <div class="hpbar"><i style="width:100%"></i></div>
     <div class="fname">${u.name}</div>
     <div class="energy-pips">${'<span class="pip"></span>'.repeat(6)}</div></div>`;
  const abHTML=(u)=>`<div class="abunit">
     <div class="ab" id="ab-${u.uid}" data-act="tapAbility" data-arg="${u.uid}">${ABILITIES[u.ability].name}<br><span style="font-size:9px">⚡${ABILITIES[u.ability].cost}</span></div>
     <div class="gbtn" id="g-${u.uid}" data-act="tapGuard" data-arg="${u.uid}" title="Guardia: protege a tu equipo">🛡</div>
   </div>`;
  $("#s-battle").innerHTML=`
    <h2 class="title">COMBATE ${CB.pvp?'<small>PvP</small>':'<small>PvE</small>'}</h2>
    <div class="arena">
      <div class="vs">VS</div>
      <div class="side enemy-side">${CB.B.map(fHTML).join("")}</div>
      <div style="height:14px"></div>
      <div class="side player-side">${CB.A.map(fHTML).join("")}</div>
    </div>
    <div id="targbar"></div>
    <div class="ability-btns">${CB.A.map(abHTML).join("")}</div>
    <div class="log" id="log"></div>
    <button class="btn sm ghost mt8" style="width:100%" data-act="flee">HUIR</button>`;
  renderCanvases($("#s-battle"));
  [...CB.A,...CB.B].forEach(u=>{u.el=$(`.fighter[data-uid="${u.uid}"]`);u.hpEl=u.el.querySelector(".hpbar i");u.pipsEl=u.el.querySelectorAll(".pip");});
  refreshArena();
}
function logMsg(m){const l=$("#log");if(!l)return;l.innerHTML+=m+"<br>";l.scrollTop=l.scrollHeight;}
function floatNum(u,txt,color){const s=document.createElement("span");s.className="floatnum";s.textContent=txt;
  s.style.color=color;s.style.left="50%";s.style.top="0";s.style.transform="translateX(-50%)";u.el.appendChild(s);setTimeout(()=>s.remove(),1000);}
const sumHp=arr=>arr.reduce((s,u)=>s+Math.max(0,u.hp),0);
function refreshArena(){
  [...CB.A,...CB.B].forEach(u=>{
    if(!u.hpEl)return;
    u.hpEl.style.width=(Math.max(0,u.hp)/u.hpMax*100)+"%";
    u.hpEl.style.background=u.hp/u.hpMax<0.3?"var(--red)":u.hp/u.hpMax<0.6?"var(--gold)":"var(--green)";
    if(u.hp<=0)u.el.classList.add("dead");
    u.el.classList.toggle("guarding", !!u.guarding && u.hp>0);
    u.pipsEl.forEach((p,i)=>p.classList.toggle("on",i<u.energy));
  });
  CB.A.forEach(u=>{
    const b=$("#ab-"+u.uid), g=$("#g-"+u.uid); if(!b)return;
    const ab=ABILITIES[u.ability]; const ready=u.hp>0&&u.energy>=ab.cost;
    const a=CB.armed[u.uid];
    const armedAb=a&&a.mode==="ability", oc=armedAb&&a.overcharge;
    b.classList.toggle("ready",ready);
    b.classList.toggle("armed",!!armedAb);
    const ocTag=u.energy>=ab.cost+2?(oc?' ⚡⚡':' <span style="opacity:.6">+SC</span>'):'';
    b.innerHTML=(armedAb?"▶ ":"")+ab.name+'<br><span style="font-size:9px">⚡'+ab.cost+ocTag+"</span>";
    if(u.hp<=0)b.style.opacity=.3;
    if(g){ g.classList.toggle("on", !!(a&&a.mode==="guard")); g.style.opacity=u.hp<=0?.3:1; }
  });
  // hints de tipo sobre los enemigos cuando estás apuntando
  const targ=CB.targeting?CB.A.find(x=>x.uid===CB.targeting):null;
  CB.B.forEach(u=>{ const h=u.el&&u.el.querySelector(".thint"); if(!h)return;
    if(targ&&u.hp>0){ const m=typeMult(targ.type,u.type); h.textContent=m>1?"⬆":m<1?"⬇":"·";
      h.style.color=m>1?"var(--green)":m<1?"var(--red)":"var(--ink-dim)"; h.style.display="block"; }
    else h.style.display="none";
    if(u.el) u.el.classList.toggle("targetable", !!(CB.targeting&&u.hp>0));
  });
  const tb=$("#targbar");
  if(tb) tb.innerHTML = CB.targeting
    ? `<div class="targhint">Apunta: toca un enemigo · <span data-act="autoTarget" style="color:var(--cyan);cursor:pointer">objetivo auto</span></div>` : "";
}
function tapAbility(uid){
  if(!CB)return; const u=CB.A.find(x=>x.uid===uid); if(!u||u.hp<=0)return;
  const ab=ABILITIES[u.ability]; const cur=CB.armed[uid];
  if(cur&&cur.mode==="ability"){
    if(u.energy>=ab.cost+2 && !cur.overcharge){ cur.overcharge=true; }      // 2º toque: sobrecarga
    else { CB.armed[uid]=null; if(CB.targeting===uid)CB.targeting=null; }    // siguiente: desarmar
  } else {
    CB.armed[uid]={mode:"ability",target:null,overcharge:false};
    CB.targeting=uid;                                                        // entra en modo apuntado
  }
  refreshArena();
}
function tapGuard(uid){
  if(!CB)return; const u=CB.A.find(x=>x.uid===uid); if(!u||u.hp<=0)return;
  const cur=CB.armed[uid];
  if(cur&&cur.mode==="guard"){ CB.armed[uid]=null; }
  else { CB.armed[uid]={mode:"guard"}; if(CB.targeting===uid)CB.targeting=null; }
  refreshArena();
}
function tapEnemy(uid){
  if(!CB||CB.targeting==null)return;
  const a=CB.armed[CB.targeting]; if(a&&a.mode==="ability"){ a.target=uid; }
  CB.targeting=null; refreshArena();
}
function autoTarget(){ if(!CB||CB.targeting==null)return; const a=CB.armed[CB.targeting]; if(a)a.target=null; CB.targeting=null; refreshArena(); }
function tick(){
  if(!CB||CB.ended)return;
  if(!CB.A.some(u=>u.hp>0)||!CB.B.some(u=>u.hp>0)){ finishBattle(); return; }
  if(CB.oi>=CB.order.length){
    CB.turn++;
    if(CB.turn>TURNS_MAX){ finishBattle(); return; }
    CB.order=E.turnOrder(CB.A,CB.B); CB.oi=0;
  }
  let u=null;
  while(CB.oi<CB.order.length){ const c=CB.order[CB.oi++]; if(c.hp>0){u=c;break;} }
  if(!u) return; // turno agotado; el siguiente tick abre turno nuevo
  E.decBuffs(u);
  u.energy=Math.min(COMBAT_ENERGY_MAX,u.energy+1);
  const mine=u.team==='A'?CB.A:CB.B, foes=u.team==='A'?CB.B:CB.A;
  let intent;
  if(u.team==='A'){
    const a=CB.armed[u.uid];
    if(a&&a.mode==='guard') intent={type:'guard'};
    else if(a&&a.mode==='ability'&&u.energy>=ABILITIES[u.ability].cost) intent={type:'ability',target:a.target,overcharge:!!a.overcharge};
    else intent={type:'basic'};
  } else intent=E.aiIntent(CB.rng,u,foes,mine);
  const action=E.performAction(CB.rng,u,intent,mine,foes);
  if(u.team==='A'){
    if(intent.type==='guard'){ CB.decisions.push({turn:CB.turn,uid:u.uid,action:'guard'}); CB.armed[u.uid]=null; }
    else if(intent.type==='ability'&&action.ability){ CB.decisions.push({turn:CB.turn,uid:u.uid,action:'ability',target:intent.target,overcharge:action.overcharge}); CB.armed[u.uid]=null; if(CB.targeting===u.uid)CB.targeting=null; }
  }
  if(action.guard) logMsg(`<span style="color:var(--cyan)">${u.name} se pone en 🛡 GUARDIA</span>`);
  else if(action.ability) logMsg(`<span style="color:var(--gold)">${u.name} usa ${action.ability}${action.overcharge?' ⚡⚡':''}</span>`);
  action.hits.forEach(h=>{const t=h.tgt; if(!t.el)return; t.el.classList.remove("hit");void t.el.offsetWidth;t.el.classList.add("hit");
    floatNum(t,(h.guarded?"🛡":"")+(h.crit?"¡":"")+h.dmg+(h.crit?"!":""),h.crit?"var(--gold)":h.guarded?"var(--cyan)":h.typeM>1?"var(--magenta)":"#fff");});
  refreshArena();
  if(!CB.A.some(x=>x.hp>0)||!CB.B.some(x=>x.hp>0)) finishBattle();
}
function finishBattle(){
  if(!CB||CB.ended)return; CB.ended=true;
  if(CB.timer){clearInterval(CB.timer);CB.timer=null;}
  // Self-check (dev): recomputar con el motor y comparar con la animación.
  try{
    const A2=CB.initA.map((s,i)=>E.unitFromStats(s,'A',i));
    const B2=CB.initB.map((s,i)=>E.unitFromStats(s,'B',i));
    if(CB.relics){ E.applyRelics(A2,CB.relics); A2.forEach((u,i)=>u.hp=Math.min(u.hpMax, CB.initA[i].hp!=null?CB.initA[i].hp:u.hpMax)); }
    const rr=E.resolveBattle(A2,B2,CB.seed,CB.decisions);
    const animWin=CB.A.some(u=>u.hp>0)&&(!CB.B.some(u=>u.hp>0)||sumHp(CB.A)>=sumHp(CB.B));
    if((rr.winner==='A')!==animWin) console.warn('AIGRONS: animación≠motor', rr.winner, animWin, CB.decisions);
  }catch(e){}
  const battleId=CB.battleId, decisions=CB.decisions, mode=CB.mode;
  setTimeout(()=>{
    if(mode==='dungeon'){
      api('/dungeon/battle',{method:'POST',body:{decisions}})
        .then(r=>{ CB=null; refreshMe().then(refreshChips); D=r.state; showDungeonResult(r); })
        .catch(err=>{ toast('Error al resolver'); CB=null; go('dungeon'); });
    } else {
      api('/battle/resolve',{method:'POST',body:{battleId,decisions}})
        .then(r=>{ refreshMe().then(refreshChips); showResult(r); })
        .catch(err=>{ toast('Error al resolver el combate'); CB=null; renderBattle(); });
    }
  },650);
}
function showResult(r){
  const win=r.win;
  openOverlay(`<div class="center">
     <div style="font-family:var(--pixel);font-size:16px;color:${win?'var(--gold)':'var(--ink-dim)'};margin-bottom:10px">${win?'¡VICTORIA!':'DERROTA'}</div>
     <div style="font-size:50px;margin-bottom:8px">${win?'🏆':'💀'}</div>
     <div class="panel" style="text-align:left">
       <div>🪙 Monedas <b style="float:right;color:var(--gold)">+${r.coins}</b></div>
       <div class="mt8">🏅 Puntos de liga <b style="float:right;color:${win?'var(--green)':'var(--red)'}">${r.leaguePoints}</b></div>
       <div class="mt8">🏆 Liga <b style="float:right;color:var(--cyan)">${r.league}</b></div>
       ${r.pvp?'<div class="mt8 dim" style="font-size:12px">Combate PvP asíncrono</div>':''}
     </div>
     <button class="btn mt8" data-act="continueBattle">CONTINUAR</button>
   </div>`);
}

       <button class="btn mt8" style="width:100%" data-act="dgLeaveShop">SEGUIR</button>`;
  } else if(D.stage==='combat'){
    body=`<div class="panel tc"><b>${D.battle&&D.battle.kind==='JEFE'?'👑 ¡JEFE!':D.battle&&D.battle.kind==='ELITE'?'💀 ¡Élite!':'⚔️ ¡Combate!'}</b>
       <div class="dim mb8" style="font-size:13px">Tu equipo conserva el HP de antes.</div>
       <button class="btn mag" data-act="dgFight">LUCHAR</button></div>`;
  }
  el.innerHTML=`<h2 class="title">MAZMORRA <small>nodo ${Math.min(D.depth+1,D.totalDepth)}/${D.totalDepth}</small></h2>${dgHeader()}${body}`;
  renderCanvases(el);
}
async function loadDgRank(){
  try{ const r=await api('/dungeon/ranking'); const box=$("#dg-rank"); if(!box)return;
    box.innerHTML=r.length?r.slice(0,10).map(x=>`<div class="rank-row ${x.me?'me':''}" style="padding:5px 4px"><span class="pos">${x.pos}</span><span class="nm">${x.name}</span><span style="color:var(--gold)">${x.cleared?'🏆 ':''}nodo ${x.depth}</span></div>`).join(""):'Nadie ha entrado aún hoy.';
  }catch(e){}
}
async function dgStart(){ try{ D=await api('/dungeon/start',{method:'POST'}); renderDungeon(); }catch(e){ toast(e.data&&e.data.error==='empty_team'?'Configura tu equipo en Combate':'No se pudo entrar'); } }
async function dgChoose(i){ try{ D=await api('/dungeon/choose',{method:'POST',body:{choice:+i}}); renderDungeon(); }catch(e){ toast('No se pudo'); } }
async function dgDraft(i){ try{ D=await api('/dungeon/draft',{method:'POST',body:{choice:+i}}); renderDungeon(); }catch(e){ toast('No se pudo'); } }
async function dgSkipDraft(){ try{ D=await api('/dungeon/draft',{method:'POST',body:{skip:true}}); renderDungeon(); }catch(e){} }
async function dgBuy(i){ try{ D=await api('/dungeon/shop',{method:'POST',body:{action:'buy',arg:+i}}); renderDungeon(); }catch(e){ toast(e.data&&e.data.error==='insufficient'?'Te faltan monedas':'No se pudo'); } }
async function dgHeal(){ try{ D=await api('/dungeon/shop',{method:'POST',body:{action:'heal'}}); renderDungeon(); }catch(e){ toast(e.data&&e.data.error==='insufficient'?'Te faltan monedas':'No se pudo'); } }
async function dgLeaveShop(){ try{ D=await api('/dungeon/shop',{method:'POST',body:{action:'leave'}}); renderDungeon(); }catch(e){} }
function dgFight(){
  const b=D.battle; if(!b){ renderDungeon(); return; }
  const A=b.team.map((s,i)=>E.unitFromStats(s,'A',i)); E.applyRelics(A,b.relics); A.forEach((u,i)=>u.hp=Math.min(u.hpMax,b.team[i].hp));
  const B=b.enemy.map((s,i)=>E.unitFromStats(s,'B',i));
  CB={A,B,seed:b.battleSeed|0,mode:'dungeon',pvp:false,rng:mulberry32(b.battleSeed>>>0),
      turn:0,order:[],oi:0,armed:{},targeting:null,decisions:[],timer:null,
      initA:b.team,initB:b.enemy,relics:b.relics,ended:false};
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("#s-battle").classList.add("active");
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.screen==='dungeon'));
  buildArena();
  const vs=$(".vs"); if(vs){vs.style.opacity=1;setTimeout(()=>{vs.style.opacity=0;},900);}
  CB.timer=setInterval(tick,640);
}
function showDungeonResult(r){
  const win=r.win; let extra='';
  if(r.cleared) extra='<div style="color:var(--gold);margin-top:6px">🏆 ¡Mazmorra completada!</div>';
  else if(r.dead) extra='<div style="color:var(--red);margin-top:6px">☠️ Tu equipo cayó.</div>';
  if(r.accountReward) extra+=`<div class="mt8">🪙 Recompensa a tu cuenta: <b style="color:var(--gold)">+${r.accountReward}</b></div>`;
  openOverlay(`<div class="center">
     <div style="font-family:var(--pixel);font-size:15px;color:${win?'var(--gold)':'var(--ink-dim)'};margin-bottom:8px">${win?'¡NODO SUPERADO!':'DERROTA'}</div>
     <div style="font-size:44px">${win?'⚔️':'☠️'}</div>
     ${win&&r.coins?`<div class="mt8">🪙 +${r.coins} monedas de mazmorra</div>`:''}
     ${extra}
     <button class="btn mt8" data-act="dgContinue">CONTINUAR</button></div>`);
}
function dgContinue(){ closeOverlay(); go('dungeon'); }

/* ====================== RANKING ====================== */
let rankTab="diario";
async function renderRanking(){
  refreshChips();
  let rows=[];
  try{ rows=await api(rankTab==="diario"?'/rankings/daily':'/rankings/league'); }catch(e){}
  const board=rows.length?rows.map(r=>`<div class="rank-row ${r.me?'me':''}">
     <span class="pos">${r.pos}</span><span class="nm">${r.name}</span>
     <span style="color:var(--gold);font-weight:700">${r.score}${rankTab==='diario'?' ✕':' pts'}</span></div>`).join("")
     :'<div class="dim tc" style="padding:24px">Aún no hay datos. ¡Juega combates!</div>';
  $("#s-ranking").innerHTML=`
    <h2 class="title">RANKING</h2>
    <div class="tabs">
      <div class="t ${rankTab==='diario'?'on':''}" data-act="setRank" data-arg="diario">DIARIO</div>
      <div class="t ${rankTab==='liga'?'on':''}" data-act="setRank" data-arg="liga">LIGA ${S.user.league}</div></div>
    ${rankTab==='diario'?'<div class="dim mb8" style="font-size:13px">Con el lote de HOY (igual para todos), ¿quién ganó más combates?</div>':`<div class="dim mb8" style="font-size:13px">Tus puntos: <b style="color:var(--cyan)">${S.user.leaguePoints}</b>. Sube de liga ganando combates.</div>`}
    <div class="panel" style="padding:4px 8px">${board}</div>`;
}
function setRank(t){rankTab=t;renderRanking();}

/* ====================== TIENDA ====================== */
async function renderShop(){
  refreshChips();
  const item=(ico,t,d,btn,act,arg,extra,disabled)=>`<div class="panel shop-item">
     <div class="ico">${ico}</div><div class="meta"><div class="t">${t}</div><div class="d">${d}</div></div>
     <button class="btn sm ${extra||''}" ${disabled?'disabled':(act?`data-act="${act}" ${arg?`data-arg="${arg}"`:''}`:'disabled')}>${btn}</button></div>`;
  $("#s-shop").innerHTML=`
    <h2 class="title">TIENDA <small class="dim">sin sorpresas tóxicas</small></h2>
    ${item("🥚","Tirada extra del lote de hoy","Aigrón aleatorio · 100🪙","TIRAR","shopRoll","", "")}
    ${item("💎","Pack de gemas","Moneda premium","COMPRAR","purchase","gems_small","mag")}
    ${item("🎟️","Pase de temporada","30 días de recompensas","COMPRAR","purchase","pass","gold")}
    ${item("⚡","Recargar energía","Energía al máximo","COMPRAR","purchase","energy_refill","")}
    <div class="dim tc mt8" style="font-size:12px">El dinero acelera tu colección, nunca compra victorias. Las compras reales se validan con el recibo de la tienda.</div>`;
}
async function shopRoll(){
  try{
    const r=await api('/shop/roll',{method:'POST'});
    const t=registerTpl(r.template);
    await Promise.all([refreshMe(),refreshCollection()]); refreshChips();
    const rays=(t.rarity==="EPICA"||t.rarity==="LEGENDARIA")?'<div class="rays"></div>':'';
    openOverlay(`<div class="center reveal" style="position:relative">${rays}<div style="position:relative;z-index:2">
       ${artTag(t,10)}
       <div style="font-size:19px;font-weight:700;margin-top:6px">${t.name}</div>
       <div class="mb8"><span class="rar-txt ${t.rarity}" style="font-weight:700">${t.rarity} · ${t.type}</span></div>
       <button class="btn" data-act="toCollection">¡GENIAL!</button></div></div>`);
  }catch(e){ const er=e.data&&e.data.error; toast(er==='daily_cap'?'Límite diario (10)':er==='insufficient'?'Te faltan monedas':'No se pudo'); }
}
async function purchase(sku){
  try{ const u=await api('/shop/purchase',{method:'POST',body:{sku}}); S.user=Object.assign(S.user,u); refreshChips(); renderShop(); toast('¡Compra aplicada!'); }
  catch(e){ if(e.status===501) toast('Requiere validación de recibo de tienda'); else toast('No disponible'); }
}

/* ====================== NAVEGACIÓN + INIT ====================== */
const RENDER={home:renderHome,battle:renderBattle,dungeon:renderDungeon,collection:renderCollection,ranking:renderRanking,shop:renderShop};
function go(screen){
  if(CB&&CB.timer&&screen!=="battle"){clearInterval(CB.timer);CB=null;}
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("#s-"+screen).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.screen===screen));
  RENDER[screen]();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.screen));
const ACTIONS={
  doClaim:()=>doClaim(),
  claimMission:(a)=>claimMission(a),
  toCollection:()=>{closeOverlay();go("collection");},
  close:()=>closeOverlay(),
  setFilter:(a)=>setFilter(a),
  levelUp:(a)=>levelUp(a),
  toggleFav:(a)=>toggleFav(a),
  release:(a)=>release(a),
  fusionPick:(a)=>fusionPick(a),
  editTeam:()=>editTeam(),
  prepBattle:()=>prepBattle(),
  goBattle:()=>goBattle(),
  saveTeam:()=>saveTeam(),
  tapAbility:(a)=>tapAbility(a),
  tapGuard:(a)=>tapGuard(a),
  tapEnemy:(a)=>tapEnemy(a),
  autoTarget:()=>autoTarget(),
  flee:()=>flee(),
  continueBattle:()=>{closeOverlay();renderBattle();},
  setRank:(a)=>setRank(a),
  shopRoll:()=>shopRoll(),
  purchase:(a)=>purchase(a),
  openTutorial:()=>openTutorial(),
  tutNext:()=>tutNext(), tutPrev:()=>tutPrev(), tutDone:()=>tutDone(),
  dgStart:()=>dgStart(), dgChoose:(a)=>dgChoose(a), dgDraft:(a)=>dgDraft(a), dgSkipDraft:()=>dgSkipDraft(),
  dgBuy:(a)=>dgBuy(a), dgHeal:()=>dgHeal(), dgLeaveShop:()=>dgLeaveShop(), dgFight:()=>dgFight(), dgContinue:()=>dgContinue(),
  goDungeon:()=>go('dungeon')
};
document.getElementById("app").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const fn=ACTIONS[el.dataset.act]; if(fn) fn(el.dataset.arg, el);
});

/* ====================== TUTORIAL (primer login) ====================== */
const TUTORIAL=[
  {ic:'🥚', t:'Bienvenido a AIGRONS', h:`Cada día nace un <b>lote nuevo</b> de criaturas únicas. <b>Reclama una gratis</b>, combate para ganar más, colecciónalas y compite en el <b>ranking diario</b> — el mismo lote para todos, así que es justo.`},
  {ic:'🎁', t:'Tu aigrón diario', h:`En <b>Inicio</b>, toca <b>ABRIR — GRATIS</b> una vez al día. Entra cada día para subir tu <b>racha</b> y completa <b>misiones</b> para ganar monedas.`},
  {ic:'📖', t:'Colección', h:`Toca un aigrón para <b>subir de nivel</b>, marcarlo <b>favorito</b>, <b>fusionar</b> dos en uno nuevo, o <b>liberar</b> duplicados a cambio de polvo.`},
  {ic:'🛡️', t:'Tu equipo', h:`En <b>Combate → EDITAR</b> elige <b>3 aigrons</b>. Los <b>tipos</b> mandan: cada uno es fuerte contra unos y débil contra otros (piedra-papel-tijera).`},
  {ic:'🎯', t:'Combate · preparación', h:`Antes de luchar eliges:<br>• <b>Capitán</b>: +15% a sus stats y +6% a todo el equipo.<br>• <b>Estancia</b>: ⚔️ Agresiva (+ATK, −DEF), 🛡️ Defensiva (+DEF, +1⚡ inicial) o ⚖️ Neutral.<br>Cada combate gasta <b>1⚡</b> (se recarga sola con el tiempo).`},
  {ic:'🕹️', t:'Combate · tu turno', h:`El 3v3 es <b>automático</b> (actúa primero quien tiene más velocidad). Tú decides cada turno:<br>• Toca una <b>habilidad</b> cuando su ⚡ esté cargada → luego toca un <b>enemigo</b> para apuntar (mira <span style="color:var(--green)">⬆</span> fuerte / <span style="color:var(--red)">⬇</span> débil por tipo).<br>• <b>🛡 Guardia</b>: esa criatura protege al equipo un turno (−40% daño recibido).<br>• <b>Sobrecarga ⚡⚡</b>: si te sobra energía, el golpe pega ×1.5.`},
  {ic:'🏆', t:'¡A jugar!', h:`Gana combates para subir de <b>liga</b> y escalar el <b>ranking diario</b>. La tienda acelera tu colección pero <b>nunca</b> compra victorias. ¡Vuelve mañana por las criaturas nuevas!`},
];
let tutI=0;
function showTutorial(i){ tutI=i||0; tutRender(); }
function tutRender(){
  const s=TUTORIAL[tutI], last=tutI===TUTORIAL.length-1, first=tutI===0;
  const dots=TUTORIAL.map((_,k)=>`<span class="tut-dot ${k===tutI?'on':''}"></span>`).join("");
  openOverlay(`<div class="center">
    <div style="font-size:46px;margin-bottom:4px">${s.ic}</div>
    <div style="font-family:var(--pixel);font-size:12px;color:var(--cyan);margin-bottom:10px">${s.t}</div>
    <div style="font-size:14px;line-height:1.55;text-align:left;margin-bottom:12px">${s.h}</div>
    <div class="tut-dots mb8">${dots}</div>
    <div class="row">
      ${first?'<button class="btn sm ghost" style="flex:1" data-act="tutDone">SALTAR</button>'
             :'<button class="btn sm ghost" style="flex:1" data-act="tutPrev">ATRÁS</button>'}
      <button class="btn sm ${last?'gold':'mag'}" style="flex:1" data-act="${last?'tutDone':'tutNext'}">${last?'¡EMPEZAR!':'SIGUIENTE'}</button>
    </div></div>`);
}
function tutNext(){ if(tutI<TUTORIAL.length-1){tutI++;tutRender();} else tutDone(); }
function tutPrev(){ if(tutI>0){tutI--;tutRender();} }
function tutDone(){ localStorage.setItem('aigrons_tut','1'); closeOverlay(); }
function openTutorial(){ showTutorial(0); }
function maybeTutorial(){ if(!localStorage.getItem('aigrons_tut')){ localStorage.setItem('aigrons_tut','1'); showTutorial(0); } }

/* ---------------- Arranque ---------------- */
function bootMsg(msg,retry){ $("#boot-msg").textContent=msg; $("#boot-spin").style.display=retry?'none':'block'; $("#boot-retry").style.display=retry?'inline-block':'none'; }
function hideBoot(){ $("#boot").classList.add("hide"); }
function showBoot(){ $("#boot").classList.remove("hide"); }
async function boot(){
  showBoot(); bootMsg('Conectando…',false);
  try{
    if(!TOKEN){ await login(); }
    try{ await refreshMe(); }
    catch(e){ if(e.status===401){ await login(); await refreshMe(); } else throw e; }
    await Promise.all([refreshDaily(),refreshCollection(),refreshTeam()]);
    hideBoot();
    go("home");
    maybeTutorial();
  }catch(e){
    bootMsg('No se pudo conectar con el servidor. Asegúrate de que la API está arrancada.',true);
  }
}
window.__retryBoot=boot;
// PWA: registra el service worker (instalable en móvil). No bloquea si falla.
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
// Refresca energía/estado periódicamente (servidor autoritativo) fuera de combate.
setInterval(()=>{ if(S.user && !(CB&&CB.timer)){ refreshMe().then(refreshChips).catch(()=>{}); } },30000);
boot();
</script>

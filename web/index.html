<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>AIGRONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">AI<b>GRONS</b></div>
    <div class="chips">
      <div class="chip coin"><span>🪙</span><span id="c-coins">0</span></div>
      <div class="chip dust"><span>✨</span><span id="c-dust">0</span></div>
      <div class="chip gem"><span>💎</span><span id="c-gems">0</span></div>
      <div class="chip ene"><span>⚡</span><span id="c-ene">5</span></div>
    </div>
    <button class="help" data-act="openTutorial" title="Tutorial">?</button>
    <button class="help" data-act="logout" title="Cerrar sesión" style="margin-left:4px">⎋</button>
  </div>

  <!-- HOME -->
  <div class="screen active" id="s-home"></div>
  <!-- BATTLE -->
  <div class="screen" id="s-battle"></div>
  <!-- COLLECTION -->
  <div class="screen" id="s-collection"></div>
  <!-- DUNGEON -->
  <div class="screen" id="s-dungeon"></div>
  <!-- RANKING -->
  <div class="screen" id="s-ranking"></div>
  <!-- SHOP -->
  <div class="screen" id="s-shop"></div>

  <div class="nav">
    <button data-screen="home" class="on"><span class="ni">🏠</span>Inicio</button>
    <button data-screen="dungeon"><span class="ni">🗺️</span>Mazmorra</button>
    <button data-screen="collection"><span class="ni">📖</span>Colección</button>
    <button data-screen="ranking"><span class="ni">🏆</span>Ranking</button>
    <button data-screen="shop"><span class="ni">🛒</span>Tienda</button>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <div class="boot" id="boot">
    <div class="logo" style="font-size:18px">AI<b>GRONS</b></div>
    <div id="boot-loading">
      <div class="spinner" id="boot-spin"></div>
      <div class="dim" id="boot-msg">Conectando…</div>
      <button class="btn sm" id="boot-retry" style="display:none;width:auto">REINTENTAR</button>
    </div>
    <div id="boot-login" style="display:none;text-align:center;max-width:300px">
      <div class="dim" style="font-size:13px;margin:14px 0 12px">Inicia sesión para jugar</div>
      <div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>
      <div id="login-dev" style="margin-top:10px"></div>
      <div id="login-err" style="color:var(--red);font-size:12px;min-height:16px;margin-top:8px"></div>
    </div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
